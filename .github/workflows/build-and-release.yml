name: Build and Release

on:
  push:
    branches:
      - main
      - 'claude/**'
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:

jobs:
  build:
    name: Build Apple Silicon Package
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Build distribution package
        run: npm run dist:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get version from package.json
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: List release files
        run: ls -la release/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ccseva-apple-silicon-${{ steps.version.outputs.version }}
          path: release/*.dmg
          retention-days: 90

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/claude/')

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from package.json
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: ccseva-apple-silicon-${{ steps.version.outputs.version }}
          path: ./artifacts

      - name: List downloaded artifacts
        run: ls -la ./artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}-${{ github.run_number }}
          name: CCSeva v${{ steps.version.outputs.version }} (Apple Silicon)
          body: |
            ## CCSeva v${{ steps.version.outputs.version }} - Apple Silicon Build

            ### Changes in this release:
            - Updated token limits to current Claude plans (Pro: 44k, Max5: 88k, Max20: 220k)
            - Fixed cache token calculation (cache tokens no longer counted in usage)
            - Apple Silicon (M1/M2/M3) optimized build

            ### Installation:
            1. Download `ccseva-apple-silicon-${{ steps.version.outputs.version }}.dmg`
            2. Open the DMG file
            3. Drag CCSeva to Applications
            4. Launch from Applications or Spotlight

            ### System Requirements:
            - macOS 10.15 or later
            - Apple Silicon (M1/M2/M3) Mac
            - Claude Code installed and configured

            Built from commit: ${{ github.sha }}
          files: ./artifacts/*.dmg
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
