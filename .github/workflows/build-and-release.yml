name: Build and Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:

jobs:
  build:
    name: Build Apple Silicon Package
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Build distribution package
        run: npm run dist:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Get version from package.json
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: List release files
        run: ls -la release/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ccseva-apple-silicon-${{ steps.version.outputs.version }}
          path: release/*.dmg
          retention-days: 90

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from package.json
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: ccseva-apple-silicon-${{ steps.version.outputs.version }}
          path: ./artifacts

      - name: List downloaded artifacts
        run: ls -la ./artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}-${{ github.run_number }}
          name: CCSeva v${{ steps.version.outputs.version }} (Apple Silicon)
          body: |
            ## 🍎 Apple Silicon Build

            **Version:** ${{ steps.version.outputs.version }}
            **Build:** #${{ github.run_number }}
            **Commit:** ${{ github.sha }}

            ### 📦 Installation
            1. Download `ccseva-apple-silicon-${{ steps.version.outputs.version }}.dmg`
            2. Open the DMG file
            3. Drag CCSeva to Applications folder

            ### ⚠️ First Launch - Bypass Gatekeeper
            macOS will show "CCSeva is damaged" because the app is not signed with an Apple Developer certificate.

            **Option 1: Terminal Command (Recommended)**
            ```bash
            xattr -cr /Applications/CCSeva.app
            ```

            **Option 2: System Settings**
            1. Try to open CCSeva (it will be blocked)
            2. Go to System Settings → Privacy & Security
            3. Scroll down and click "Open Anyway" next to CCSeva
            4. Click "Open" in the confirmation dialog

            After this one-time step, CCSeva will launch normally.

            ### ⚙️ System Requirements
            - macOS 10.15 or later
            - Apple Silicon (M1/M2/M3/M4) Mac
            - Claude Code installed and configured

            ---

          files: ./artifacts/*.dmg
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
